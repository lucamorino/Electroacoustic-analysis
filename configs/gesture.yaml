# Event-based material: one row per gesture, via onset detection.
# 'complex' responds to both amplitude and phase change, which catches soft
# spectral entries that an energy-based detector misses.  Lower onset_alpha
# for more onsets, raise it for fewer.
audio:
  sample_rate: 44100

segmentation:
  method: onset
  onset_method: complex
  onset_frame_size: 1024
  onset_hop_size: 512
  onset_alpha: 0.1
  onset_silence_threshold: 0.02
  onset_include_lead: true
  min_duration: 0.2     # merge anything shorter into its neighbour
  max_duration: 10.0
  pad: 0.0

essentia:
  groups: [dynamics, spectral, noisiness, mfcc, harmonic]
  frame_size: 1024      # short frames: gestures are short
  hop_size: 512

psychoacoustics:
  enabled: true
  metrics: [loudness, sharpness, roughness, tonality]
  min_duration: 0.3     # shorter segments get skipped, flagged psycho.skipped

output:
  directory: analysis

jobs: 4
